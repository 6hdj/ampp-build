name: build-ampp-plugin

on:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AM++ plugin source (upstream)
        run: |
          curl -fsSL -o src.zip https://github.com/Kifranei/AM-plus-plus-media-plugin/archive/refs/heads/main.zip
          unzip -q src.zip
          mv AM-plus-plus-media-plugin-main ampp-src

      - name: Apply local patches
        run: |
          cd ampp-src
          shopt -s nullglob
          for p in ../patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p" || exit 1
          done
          echo "Patches applied: $(ls ../patches 2>/dev/null | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ampp-src/**/*.gradle*', 'ampp-src/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build plugin ZIP
        working-directory: ampp-src
        run: |
          chmod +x gradlew
          ./gradlew :media-plugin:pluginZip --stacktrace

      - name: Collect artifact
        run: cp ampp-src/media-plugin/build/dist/*.zip ampp-media-plugin.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ampp-media-plugin.zip \
            --title "AM++ media plugin build ${{ github.run_number }}" \
            --notes "Cloud build run ${{ github.run_number }}, source commit ${{ github.sha }}"
