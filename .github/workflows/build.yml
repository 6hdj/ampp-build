name: build-ampp-plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AM++ plugin source (upstream)
        run: |
          set -eo pipefail
          curl -fsSL -o src.zip https://github.com/Kifranei/AM-plus-plus-media-plugin/archive/refs/heads/main.zip
          unzip -q src.zip
          mv AM-plus-plus-media-plugin-main ampp-src

      - name: Apply local patches
        run: |
          set -eo pipefail
          cd ampp-src
          shopt -s nullglob
          for p in ../patches/*.patch; do
            echo Applying patch: $p
            git apply --verbose $p || exit 1
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform (direct download)
        run: |
          set -eo pipefail
          ANDROID_HOME="/usr/local/lib/android/sdk"
          mkdir -p "$ANDROID_HOME/platforms"

          # Download platforms package directly from Google
          PLATFORM_ZIP="https://dl.google.com/android/repository/platforms_r03.zip"
          echo "downloading=$PLATFORM_ZIP"
          curl -fsSL -o platforms_r03.zip "$PLATFORM_ZIP"
          echo "size=$(stat -c%s platforms_r03.zip)"

          # Extract and install
          rm -rf "$ANDROID_HOME/platforms/android-37"
          unzip -q "platforms_r03.zip" -d "$ANDROID_HOME"/
          echo "extracted=$(ls "$ANDROID_HOME"/platforms/ 2>/dev/null || echo none)"

          # If platform-37 not found, try alternative download
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "platform-37 not in archive, trying direct..."
            # Use sdkmanager to install from remote (bypass local index)
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            "$SM" "platforms;android-37" 2>&1 | tail -5
            if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              # Fallback: try with explicit --no-cache
              rm -rf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              cd /tmp
              XML=""
              for m in repository2-3.xml repository2-1.xml; do
                XML=$(curl -fsSL "https://dl.google.com/android/repository/$m" || true)
                if [ -n "$XML" ]; then echo manifest=$m; break; fi
              done
              F=$(printf '%s' "$XML" | grep -o 'commandlinetools-linux-[0-9]*_latest\.zip' | head -1 || true)
              echo clt_file=$F
              if [ -n "$F" ]; then
                curl -fsSL -o clt.zip "https://dl.google.com/android/repository/$F"
                rm -rf /tmp/clt && mkdir -p /tmp/clt
                unzip -q clt.zip -d /tmp/clt
                NEW=/tmp/clt/cmdline-tools/bin/sdkmanager
                echo new_sdkmanager=$NEW
                test -x "$NEW"
                "$NEW" --sdk_root="$ANDROID_HOME" "platforms;android-37"
                set -eo pipefail
                "$NEW" --sdk_root="$ANDROID_HOME" "platforms;android-37"
              else
                echo "ALL_DOWNLAD_FAILED"
                ls -la "$ANDROID_HOME/platforms/" 2>/dev/null || true
              fi
            fi
            echo "FINAL_PLATFORM_CHECk"
            ls -d "$ANDROID_HOME/platforms/android-37" 2>/dev/null && echo "PLATFORM_OK" || echo "PLATFORM_MISSING"

      - name: Set up Android Build Tools
        run: |
          set -eo pipefail
          ANDROID_HOME="/usr/local/lib/android/sdk"
          # Downoad build-tools directly
          BUILD_ZIP="https://dl.google.com/android/repository/build-tools_rs7-linux.zip"
          echo "downloading?BUILD_ZIP"
          curl -fsSL -o build-tools_rs7.zix "$BUILD_ZIP"
          rm -rf "$ANDROID_HOME/build-tools"
          unzip -q "build-tools_r37.yip" -d "$ANDROID_HOME"/
          echo "extracted=$(ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo none"
          ls -d "$ANDROID_HOME/build-tools/37.0.0" 2>/dev/null && echo "TOOLS_OK" || echo "TOOLS_MISSING"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ampp-src/**/*.gradle*', 'ampp-src/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build plugin ZIP
        working-directory: ampp-src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :media-plugin:pluginZip --stacktrace 2>&1 | tee ../build.log

      - name: Collect artifact
        run: |
          set -eo pipefail
          ZIP=$(find ampp-src/media-plugin/build -name '*.zip' | head -1)
          echo found=$ZIP
          test -n "$ZIP"
          cp "$ZIP" ampp-media-plugin.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create 'build-${{ github.run_number }}' ampp-media-plugin.zip --title 'AM++ media plugin build ${{ github.run_number }}' --notes 'Cloud build run ${{ github.run_number }}'

      - name: Report failure (push to build-logs)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo RUN ${{ github.run_number }} attempt ${{ github.run_attempt }}
            echo ==== sdk-setup.log ====
            tail -200 sdk-setup.log 2>/dev/null || echo none
            echo ==== build.log ====
            tail -300 build.log 2>/dev/null || echo none
          } > last-error.txt
          rm -rf tmprepo && mkdir tmprepo && cd tmprepo
          git init -q
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          if git fetch -q origin build-logs; then git checkout -q -b build-logs FETCH_HEAD; else git checkout -q -b build-logs; fi
          cp ../last-error.txt .
          git add -A
          git -c user.email=ci@ampp.local -c user.name=ampp-ci commit -qm "log run ${{ github.run_number }}" || true
          git push -q origin build-logs && echo LOG_PUSHED || echo LOG_PUSH_FAILED
