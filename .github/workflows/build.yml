name: build-ampp-plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AM++ plugin source (upstream)
        run: |
          set -eo pipefail
          curl -fsSL -o src.zip https://github.com/Kifranei/AM-plus-plus-media-plugin/archive/refs/heads/main.zip
          unzip -q src.zip
          mv AM-plus-plus-media-plugin-main ampp-src

      - name: Apply local patches
        run: |
          set -eo pipefail
          cd ampp-src
          shopt -s nullglob
          for p in ../patches/*.patch; do
            echo Applying patch: $p
            git apply --verbose $p || exit 1
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -eo pipefail
          {
            echo ANDROID_HOME=$ANDROID_HOME
            echo ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
            SM=$(command -v sdkmanager || true)
            if [ -z "$SM" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
            if [ -z "$SM" ]; then SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1); fi
            echo sdkmanager=$SM
            test -n "$SM"
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-37" "build-tools;37.0.0"
          } 2>&1 | tee sdk-setup.log

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ampp-src/**/*.gradle*', 'ampp-src/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build plugin ZIP
        working-directory: ampp-src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :media-plugin:pluginZip --stacktrace 2>&1 | tee ../build.log

      - name: Collect artifact
        run: |
          set -eo pipefail
          ZIP=$(find ampp-src/media-plugin/build -name '*.zip' | head -1)
          echo found=$ZIP
          test -n "$ZIP"
          cp "$ZIP" ampp-media-plugin.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create 'build-${{ github.run_number }}' ampp-media-plugin.zip --title 'AM++ media plugin build ${{ github.run_number }}' --notes 'Cloud build run ${{ github.run_number }}'

      - name: Report failure (push to build-logs)
        if: failure()
         levn: 
            GH_TOKEN: ${{ github.token }}
         run: |
          {
            echo RUN ${{ github.run_number }} attempt ${{ github.run_attempt }}
            echo ==== sdk-setup.log ====
            tail -100 sdk-setup.log 2>/dev/null || echo none
            echo ==== build.log ====
            tail -200 build.log 2>/dev/null || echo none
          } > last-error.txt
          rm -rf tmprepo && mkdir tmprepo && cd tmprepo
          git init -q
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          if git fetch -q origin build-logs; then git checkout -q -b build-logs FETCH_HEAD; else git checkout -q -b build-logs; fi
          cp ../last-error.txt .
          git add -A
          git -c user.email=ci@ampp.local -c user.name=ampp-ci commit -qm "log run ${{ github.run_number }}" || true
          git push -q origin build-logs && echo LOG_PUSHED || echo LOG_PUSH_FAILED
